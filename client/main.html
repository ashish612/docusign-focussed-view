<!DOCTYPE html>
<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/pace-js@latest/pace.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pace-js@latest/pace-theme-default.min.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>FrontEnd Portal</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">                
        <style>
            .hide {display: none;}
        
            #signing-ceremony, #main {
                flex: 1;
            }
    </style>        
    </head>
    <body>
        <div id="signing-ceremony" hidden></div>                 
        <div id="main" class="container pt8">
            <h3>
                <p>Toy Example</p>
            </h3>
            <form class="row g-3" >

                <div class="col-md-12">
                    <label class="form-label" for="email">Email address:</label>
                    <input id="email" type="email" class="form-control" name="email" value="me@gmail.com"/> 
                </div>
                
                <div class="col-md-12">
                    <label for="company_name" class="form-label">Company Name:</label>
                    <input id="company_name" name="company_name" type="text" class="form-control" value="My Company"/>
                </div>

                <div class="col-md-3">
                    <label for="svc_address" class="form-label">Service Address:</label>
                    <input id="svc_address" name="svc_address" class="form-control" type="text" value="123 Main St"/>
                </div>

                <div class="col-md-3">
                    <label for="svc_city" class="form-label">City:</label>
                    <input id="svc_city" name="svc_city" type="text" class="form-control" value="Boulder"/>
                </div>    

                <div class="col-md-3">
                    <label for="svc_state" class="form-label">State:</label>
                    <input id="svc_state" name="svc_state" type="text" class="form-control" value="Colorado"/>
                </div>
                
                <div class="col-md-3">
                    <label for="svc_zipcode" class="form-label">ZipCode:</label>
                    <input id="svc_zipcode" name="svc_zipcode" type="text" class="form-control" value="08352"/>
                </div>
                
                <div class="col-md-6">
                    <label for="carrier_name" class="form-label">Carrier Name:</label>
                    <input id="carrier_name" name="carrier_name" type="text" class="form-control" value="T Mobile"/>
                </div>

                <div class="col-md-6">
                    <label for="carrier_btn" class="form-label">Carrier Billing Telephone Number:</label>
                    <input id="carrier_btn" name="carrier_btn" type="text" class="form-control" value="4446663332"/>
                </div>

                <div class="col-md-12">
                    <label for="numbers" class="form-label">Numbers to Port:</label>
                    <input id="numbers" name="numbers" type="text" class="form-control" value="2143364000-2143365000"/>
                </div>
                
                <div class="col-md-6">
                    <label for="auth_contact_name" class="form-label">Authorized Contact:</label>
                    <input id="auth_contact_name" name="auth_contact_name" type="text" class="form-control" value="Ashish Arora"/>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" onclick="getRecipientUrl(event)">Sign Now!</button>
                </div>        
        
            </form>                    
        </div>
        
        <script src="https://js-d.docusign.com/bundle.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

        <script>
            function getRecipientUrl(e){                
                e.stopPropagation();
                e.preventDefault();
                let newData = {
                    "company_name": document.getElementById('company_name').value,
                    "service_info":{
                        "address" :document.getElementById('svc_address').value,
                        "city" : document.getElementById('svc_city').value,
                        "state" : document.getElementById('svc_state').value,
                        "zipcode": document.getElementById('svc_zipcode').value
                    },
                    "carrier_info":{
                        "name": document.getElementById('carrier_name').value,
                        "btn": document.getElementById('carrier_btn').value
                    },
                    "numbers":document.getElementById('numbers').value,
                    "auth_contact_name":document.getElementById('auth_contact_name').value,
                    "email" : document.getElementById('email').value
                }
                return fetch("http://localhost:5000/envelope", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newData)
                    })
                    .then(response => {
                        return response.json();
                    })   
                    .then(data => {
                        console.log('Success:', data);
                        loadDocusign(data);
                    })         
                    .catch(error => {
                        console.error('Error:', error);
                    });
            }

            async function loadDocusign(data){                
                let clientId = data.client_id; // your app’s IK
                const signingConfiguration = {
                    url: data.url,
                    displayFormat: 'focused',            
                }
                try {
                    const docusign = await window.DocuSign.loadDocuSign(clientId);
                    const signing = docusign.signing(signingConfiguration);
                        
                    signing.on('ready', (event) => {
                        $('#signing-ceremony > iframe').css('height', `${window.innerHeight - 70}px`);
                        
                        console.log('UI is rendered');
                    });
                    signing.on('sessionEnd', (event) => {
                        /** The event here denotes what caused the sessionEnd to trigger, such as signing_complete, ttl_expired etc../ */
                        console.log('sessionend', event);
                        // Event: { returnUrl: url, type: "sessionEnd", sessionEndType: "signing_complete"}                        
                        if (event.type === "sessionEnd") {
                            const msg = `<p>Result: <b>${event.sessionEndType.replace("_", " ")}</b></p>`;                            
                            console.log("Signing session ended", msg);
                        } else {
                            const msg = `<p>Event data: ${JSON.stringify(event)}</p>`;                            
                            console.log("Signing Session Message", msg);
                        }                         
                        document.getElementById("signing-ceremony").setAttribute("hidden", "")
                        $("#main").removeClass("hide"); // Display the container
                    });


                    // Open the signing ceremony
                    $("#main").addClass("hide"); // JQuery to hide content
                    $("#signing-ceremony").removeAttr("hidden"); // Display the container
                    signing.mount(`#signing-ceremony`);
                } catch (error) {
                    // Any configuration or API limits will be caught here
                    console.log ("### Error calling docusign.js");
                    console.log (error);              
                }          
            }
        </script>
    </body>
</html>
